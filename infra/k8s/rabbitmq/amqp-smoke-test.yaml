apiVersion: batch/v1
kind: Job
metadata:
  name: amqp-smoke-test
  namespace: gojudge
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: amqp-smoke-test
          image: golang:1.24-alpine
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /app && cd /app
              cat > main.go <<'EOF'
              package main

              import (
                  "context"
                  "fmt"
                  "log"
                  "net/url"
                  "os"
                  "time"

                  amqp "github.com/rabbitmq/amqp091-go"
              )

              func main() {
                  u := url.URL{
                      Scheme: "amqp",
                      User:   url.UserPassword(os.Getenv("RABBITMQ_USER"), os.Getenv("RABBITMQ_PASSWORD")),
                      Host:   os.Getenv("RABBITMQ_HOST") + ":5672",
                  }
                  conn, err := amqp.Dial(u.String())
                  if err != nil {
                      log.Fatalf("connect: %v", err)
                  }
                  defer conn.Close()
                  fmt.Printf("connected to %s:5672 over AMQP, RabbitMQ %v\n", os.Getenv("RABBITMQ_HOST"), conn.Properties["version"])

                  ch, err := conn.Channel()
                  if err != nil {
                      log.Fatalf("channel: %v", err)
                  }
                  defer ch.Close()

                  const queue = "smoke-amqp"
                  if _, err := ch.QueueDeclare(queue, true, false, false, false, nil); err != nil {
                      log.Fatalf("declare: %v", err)
                  }
                  defer ch.QueueDelete(queue, false, false, false)

                  ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
                  defer cancel()
                  body := "hello-amqp"
                  if err := ch.PublishWithContext(ctx, "", queue, false, false,
                      amqp.Publishing{ContentType: "text/plain", DeliveryMode: amqp.Persistent, Body: []byte(body)}); err != nil {
                      log.Fatalf("publish: %v", err)
                  }
                  fmt.Println("published:", body)

                  msgs, err := ch.Consume(queue, "smoke", false, false, false, false, nil)
                  if err != nil {
                      log.Fatalf("consume: %v", err)
                  }
                  select {
                  case m := <-msgs:
                      if err := m.Ack(false); err != nil {
                          log.Fatalf("ack: %v", err)
                      }
                      fmt.Println("consumed:", string(m.Body))
                      if string(m.Body) != body {
                          log.Fatalf("unexpected message: %q", m.Body)
                      }
                  case <-ctx.Done():
                      log.Fatal("no message received within 10s")
                  }
                  fmt.Println("AMQP publish and consume on port 5672: OK")
              }
              EOF
              go mod init smoke >/dev/null 2>&1
              go get github.com/rabbitmq/amqp091-go@v1.10.0
              go run .