apiVersion: batch/v1
kind: Job
metadata:
  generateName: spk01-sc-04-gate-                # змінено
  namespace: spk01
  labels:
    app: spk01
    criterion: SC-04                          # змінено
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120                  # змінено: компіляції більше немає
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: spk01
        criterion: SC-04                      # змінено
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: judge
          image: gojudge-spk01:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/test2json", "-t", "/usr/local/bin/trusted.test", "-test.v=test2json", "-test.run", "^(TestEstablishedConnection|TestNetworkEgress)$"]   # змінено
          env:
            - name: HOME
              value: /tmp                     # GOCACHE прибрано: компіляції немає
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "512Mi", cpu: "1" }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      initContainers:
        - name: net-gate
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: [ "sh", "-c" ]
          args:
            - |
              for i in $(seq 1 30); do
                t=$(cut -d' ' -f1 /proc/uptime)
                if nc -w 1 1.1.1.1 443 </dev/null 2>/dev/null; then
                  echo "gate attempt=$i uptime=$t egress=OPEN"
                else
                  echo "gate attempt=$i uptime=$t egress=BLOCKED -> starting main container"
                  exit 0
                fi
                sleep 1
              done
              echo "gate: egress still OPEN after 30 attempts -> refusing to start"
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          resources:
            requests: { memory: "16Mi", cpu: "50m" }
            limits: { memory: "32Mi", cpu: "100m" }