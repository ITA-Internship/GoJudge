apiVersion: batch/v1
kind: Job
metadata:
  generateName: spk01-sc-06-control-   # змінено
  namespace: spk01
  labels:
    app: spk01
    criterion: SC-06                   # змінено
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: spk01
        criterion: SC-06               # змінено
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
        - name: judge
          image: gojudge-spk01:dev
          imagePullPolicy: Never
          command: ["go", "test", "-json", "-run", "^TestPrivilegeCheck$", "./..."]   # змінено
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"