# Both values are shown in SonarQube Cloud (Project information). Not secrets.
# TODO: sonar.projectKey=PROJECT_KEY
# TODO: sonar.organization=ORGANIZATION

sonar.sources=.
# Kubernetes manifests in infra/ and the workflows in .github/ are analysed as
# configuration files (AC-02). Only tests, vendored and generated code, IDE files
# and pure documentation are excluded.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/*.pb.go,**/*_gen.go,**/zz_generated*.go,.idea/**,docs/**,specs/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

sonar.go.coverage.reportPaths=coverage.out

# Wait for the Quality Gate result. The scan step (and the "Unit tests" job)
# fails when the gate fails or no result arrives in time (AC-10).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300